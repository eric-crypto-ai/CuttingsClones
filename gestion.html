<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CuttingsClones — Nos hemos mudado</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="8; url=https://cuttingsclones-web.vercel.app/">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px; background: #0f1511; color: #e8f0ea;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .caja { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; color: #a9bdb0; }
  .aviso {
    background: #2a1c10; border: 1px solid #7a4a1e; color: #ffd9ac;
    border-radius: 12px; padding: 14px 16px; margin: 20px 0; text-align: left; font-size: 0.95rem;
  }
  a.boton {
    display: block; padding: 20px; border-radius: 14px; text-decoration: none;
    background: #2f9e5e; color: #fff; font-size: 1.15rem; font-weight: 600;
  }
  a.boton:active { background: #268650; }
  .pie { margin-top: 18px; font-size: 0.85rem; color: #7d9285; }
</style>
</head>
<body>
  <div class="caja">
    <h1>🌿 CuttingsClones se ha mudado</h1>
    <p>Este portal ya no está en uso.</p>

    <div class="aviso">
      <strong>Importante:</strong> esta página vieja ya <strong>no guarda nada</strong>.
      Si marcas algo aquí, no se registra. Entra por la app nueva.
    </div>

    <a class="boton" href="https://cuttingsclones-web.vercel.app/">Ir a la app nueva →</a>

    <p class="pie">
      Te llevamos solo en unos segundos.<br>
      <strong>Guarda la dirección nueva en el móvil</strong> y borra el marcador viejo.
    </p>
  </div>
</body>
</html>
